# Name displayed in the GitHub Actions tab
name: CI

# Run the workflow whenever code is pushed or a pull request is opened.
on:
  push:
  pull_request:

# Grant the workflow read-only access to repository contents.
permissions:
  contents: read

# Define the jobs that make up the CI pipeline.
jobs:
  build:
    # Run the job on a fresh Ubuntu environment.
    runs-on: ubuntu-latest

    steps:
      # Download the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js and enable npm dependency caching.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      # Install root dependencies.
      - name: Install root dependencies
        run: npm ci

      # Install client dependencies.
      - name: Install client dependencies
        run: npm ci --prefix client

      # Install server dependencies.
      - name: Install server dependencies
        run: npm ci --prefix server

      # Run formatting, linting, tests, and production builds.
      - name: Run checks
        run: npm run check
